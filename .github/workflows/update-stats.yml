name: Update GitHub Stats

on:
  schedule:
    - cron: '0 1 * * *'  # 9:00 AM Beijing Time (UTC+8)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'templates/**'
      - '.github/workflows/update-stats.yml'

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate all SVG cards
        env:
          # 若配置了 PAT_TOKEN(需 repo 权限的经典 PAT)，可统计私有仓库贡献;
          # 未配置时回退到 GITHUB_TOKEN(只能统计公开贡献)
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        # 数据获取失败时脚本以非零码退出，保留上一版卡片，避免空数据覆盖线上视觉
        run: python scripts/generate_cards.py

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/
          git diff --cached --quiet || (git commit -m "chore: update stats cards [skip ci]" && git push)
