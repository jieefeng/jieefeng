            stroke="#2DD4BF" stroke-opacity=".8"/>
      <rect class="blip" x="30" y="138.0" width="5" height="5" rx="1" fill="#2DD4BF"
            style="animation-delay:-1.60s"/>

      <text x="50" y="146.0" font-size="11.5" font-weight="600" fill="#FDE68A">Embedding 调优 · 系统设计 · 云原生</text>
      <text x="50" y="160.0" font-size="7.5" fill="#8FA0B5" fill-opacity=".9">每天攒一点技能点</text>

      <rect x="418.0" y="145.0" width="150.0" height="6" rx="3" fill="#1E2733"/>
      <rect x="418.0" y="145.0" width="61.5" height="6" rx="3" fill="url(#barfill)"/>
      <g clip-path="url(#qb2)">
        <g class="scan" style="animation-delay:-3.40s">
          <rect x="-30" y="143.0" width="30" height="10" fill="#FBBF24" opacity=".22"/>
        </g>
      </g>
      <text x="578.0" y="151.0" font-size="7.5" fill="#8FA0B5">41%</text>

      <rect x="674.0" y="140.5" width="60.0" height="15" rx="7.5"
            fill="#2DD4BF" fill-opacity=".10" stroke="#2DD4BF" stroke-opacity=".45"/>
      <text x="704.0" y="150.5" text-anchor="middle" font-size="7.5"
            fill="#2DD4BF">学习中</text>
    </g>

    <line x1="26" y1="33.5" x2="734" y2="33.5" stroke="#8FA0B5" stroke-opacity=".22"/>
    <line x1="26" y1="176.0" x2="734" y2="176.0"
