          <rect x="-30" y="55.0" width="30" height="10" fill="#FBBF24" opacity=".22"/>
        </g>
      </g>
      <text x="578.0" y="63.0" font-size="7.5" fill="#8FA0B5">72%</text>

      <rect x="674.0" y="52.5" width="60.0" height="15" rx="7.5"
            fill="#FBBF24" fill-opacity=".10" stroke="#FBBF24" stroke-opacity=".45"/>
      <text x="704.0" y="62.5" text-anchor="middle" font-size="7.5"
