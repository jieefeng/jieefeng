      <rect x="418.0" y="101.0" width="150.0" height="6" rx="3" fill="#1E2733"/>
      <rect x="418.0" y="101.0" width="87.0" height="6" rx="3" fill="url(#barfill)"/>
      <g clip-path="url(#qb1)">
        <g class="scan" style="animation-delay:-1.70s">
          <rect x="-30" y="99.0" width="30" height="10" fill="#FBBF24" opacity=".22"/>
