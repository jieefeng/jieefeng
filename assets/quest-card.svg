      <text x="26" y="194.0" font-size="7" letter-spacing="2.2" fill="#8FA0B5">CO-OP</text>
      <text x="78" y="194.0" font-size="8" fill="#FDE68A" fill-opacity=".82">开放组队：Python / Java 后端 · RAG 落地 · 全栈开发</text>
      <text x="734" y="194.0" font-size="7" fill="#8FA0B5" fill-opacity=".75"
