<svg xmlns="http://www.w3.org/2000/svg" width="760" height="208" viewBox="0 0 760 208"
     role="img"
     aria-label="任务日志：RAG 检索链路优化（进行中，72%）；后端服务工程化（进行中，58%）；Embedding 调优 · 系统设计 · 云原生（学习中，41%）">
  <title>任务日志</title>

  <style>
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
    @keyframes blip { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }
    .blip { animation: blip 2.6s ease-in-out infinite }

    @keyframes scan {
      from { transform: translateX(0) }
      to   { transform: translateX(150.0px) }
    }
    .scan { animation: scan 4.4s linear infinite }

    @keyframes rowIn { from { transform: translateX(-6px) } to { transform: translateX(0) } }
    .row { animation: rowIn .45s cubic-bezier(.22,.7,.3,1) both }
  </style>

  <defs>
    <linearGradient id="qbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070A10"/>
      <stop offset="1" stop-color="#161D28"/>
    </linearGradient>
    <linearGradient id="barfill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <clipPath id="qcard"><rect x="1" y="1" width="758" height="206" rx="15"/></clipPath>
    <clipPath id="qb0"><rect x="418.0" y="57.0" width="108.0" height="6" rx="3"/></clipPath>
    <clipPath id="qb1"><rect x="418.0" y="101.0" width="87.0" height="6" rx="3"/></clipPath>
    <clipPath id="qb2"><rect x="418.0" y="145.0" width="61.5" height="6" rx="3"/></clipPath>
  </defs>

  <rect x="1" y="1" width="758" height="206" rx="15"
        fill="#070A10" stroke="#B45309" stroke-opacity=".55" stroke-width="1.5"/>

  <g clip-path="url(#qcard)">
    <rect x="0" y="0" width="760" height="208" fill="url(#qbg)"/>

    <g class="row" style="animation-delay:0.00s">
      <rect x="26" y="46.0" width="13" height="13" rx="3.5" fill="none"
            stroke="#FBBF24" stroke-opacity=".8"/>
      <rect class="blip" x="30" y="50.0" width="5" height="5" rx="1" fill="#FBBF24"
            style="animation-delay:-0.00s"/>

      <text x="50" y="58.0" font-size="11.5" font-weight="600" fill="#FDE68A">RAG 检索链路优化</text>
      <text x="50" y="72.0" font-size="7.5" fill="#8FA0B5" fill-opacity=".9">召回 · 重排 · 评估闭环</text>

      <rect x="418.0" y="57.0" width="150.0" height="6" rx="3" fill="#1E2733"/>
      <rect x="418.0" y="57.0" width="108.0" height="6" rx="3" fill="url(#barfill)"/>
      <g clip-path="url(#qb0)">
